[package]
name = "steam-transfer"
version = "2.1.0"
edition = "2024"
description = "Copy installed Steam games between Windows PCs over USB4/Thunderbolt, Ethernet, Wi-Fi or a USB drive."
repository = "https://github.com/945040ad/Steam-Transfer"
readme = "README.md"
publish = false

[[bin]]
name = "SteamTransfer"
path = "src/main.rs"

[dependencies]
filetime = "0.2.29"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
lz4_flex = "0.14.0"
netdev = "0.47.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = "1.18.1"
socket2 = "0.6.5"
sysinfo = "0.40.3"
walkdir = "2.5.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_IO"] }
winreg = "0.56.0"
wmi = "0.18.4"
zstd = "0.14.4"

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
