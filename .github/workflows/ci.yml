name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Test
        # The end-to-end test skips itself when Steam/Wallpaper Engine isn't installed (as on CI runners).
        run: cargo test --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: SteamTransfer
          path: target/release/SteamTransfer.exe
